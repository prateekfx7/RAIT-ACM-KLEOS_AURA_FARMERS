name: sheshield_mesh
description: SheShield Mesh - Emergency SOS that survives network blackouts via device-to-device relay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5
  http: ^1.2.0
  flutter_reactive_ble: ^5.0.2
  permission_handler: ^10.4.0
  geolocator: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
